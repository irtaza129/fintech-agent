<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintech AI Agent - Portfolio Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * { font-family: 'Inter', sans-serif; }

        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
        }

        .ticker-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            border: 2px solid transparent;
            letter-spacing: 0.02em;
        }
        .ticker-pill:hover {
            transform: scale(1.06);
            filter: brightness(1.1);
        }
        .ticker-pill:active {
            transform: scale(0.97);
        }

        .category-tab {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            color: #6b7280;
            border: 1.5px solid transparent;
        }
        .category-tab:hover { background: #f3f4f6; color: #374151; }
        .category-tab.active {
            background: #6d28d9;
            color: #fff;
            border-color: #6d28d9;
        }

        .pulse-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-anim 2s infinite;
        }
        @keyframes pulse-anim {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .sentiment-bullish { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
        .sentiment-bearish { background: #fee2e2; color: #dc2626; border: 1.5px solid #fca5a5; }
        .sentiment-neutral { background: #f3f4f6; color: #6b7280; border: 1.5px solid #d1d5db; }

        .impact-high { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }
        .impact-medium { background: #fef9c3; color: #a16207; border: 1.5px solid #fde047; }
        .impact-low { background: #dbeafe; color: #1d4ed8; border: 1.5px solid #93c5fd; }

        .tab-btn {
            padding: 12px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 3px solid transparent;
            color: #6b7280;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .tab-btn:hover { color: #6d28d9; }
        .tab-btn.active {
            color: #6d28d9;
            border-bottom-color: #6d28d9;
        }

        .glass-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 35%, #4c1d95 70%, #5b21b6 100%);
        }

        .digest-card {
            border-left: 4px solid #6d28d9;
            transition: border-color 0.2s;
        }
        .digest-card:hover { border-left-color: #7c3aed; }

        .summary-item {
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }
        .summary-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="glass-header text-white shadow-2xl">
        <div class="max-w-7xl mx-auto px-6 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur">
                        <i class="fas fa-chart-line text-2xl text-purple-200"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">Fintech AI Agent</h1>
                        <p class="text-purple-200 text-sm mt-0.5">AI-Powered Portfolio News Digest</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="liveIndicator" class="hidden items-center gap-2 bg-white/10 px-4 py-2 rounded-full text-sm backdrop-blur">
                        <div class="pulse-dot"></div>
                        <span class="text-purple-100 font-medium" id="liveUserLabel">Signed in</span>
                    </div>
                    <button
                        id="refreshButton"
                        onclick="refreshDigestNow()"
                        class="hidden bg-white text-purple-700 px-5 py-2.5 rounded-xl font-semibold shadow-lg hover:shadow-xl hover:bg-purple-50 transition-all text-sm flex items-center gap-2">
                        <i class="fas fa-bolt text-yellow-500"></i>
                        Get Latest News
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8 space-y-6">

        <!-- Sign In Card -->
        <div id="loginSection" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <div class="max-w-md mx-auto text-center">
                <div class="w-16 h-16 bg-purple-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-user-circle text-3xl text-purple-600"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-900 mb-2">Sign In to Your Portfolio</h2>
                <p class="text-gray-500 text-sm mb-6">Enter your email to access your personalized news digest</p>
                <div class="flex gap-3">
                    <input
                        type="email"
                        id="userEmail"
                        placeholder="you@example.com"
                        class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition text-sm outline-none"
                        onkeypress="if(event.key==='Enter') signIn()"
                    >
                    <button
                        onclick="signIn()"
                        class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-semibold shadow-sm hover:shadow-md transition-all text-sm whitespace-nowrap">
                        <i class="fas fa-arrow-right mr-1.5"></i>Sign In
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainContent" class="hidden space-y-6">

            <!-- Quick Add Row -->
            <div class="grid lg:grid-cols-5 gap-6">

                <!-- Stock Browser (3/5) -->
                <div class="lg:col-span-3 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-gray-900 flex items-center gap-2">
                            <i class="fas fa-fire text-orange-400"></i>
                            Quick Add Stocks
                        </h3>
                        <div class="flex gap-1.5 flex-wrap" id="categoryTabs">
                            <button class="category-tab active" onclick="filterCategory('all', this)">All</button>
                            <button class="category-tab" onclick="filterCategory('bigtech', this)">Big Tech</button>
                            <button class="category-tab" onclick="filterCategory('ai', this)">AI & Chips</button>
                            <button class="category-tab" onclick="filterCategory('ev', this)">EV</button>
                            <button class="category-tab" onclick="filterCategory('finance', this)">Finance</button>
                            <button class="category-tab" onclick="filterCategory('fintech', this)">Fintech</button>
                            <button class="category-tab" onclick="filterCategory('other', this)">Other</button>
                        </div>
                    </div>

                    <div id="stockPills" class="flex flex-wrap gap-2 mb-4 min-h-[80px]">
                        <!-- Populated by JS -->
                    </div>

                    <div class="flex gap-2 pt-3 border-t border-gray-100">
                        <input
                            type="text"
                            id="customTicker"
                            placeholder="Custom ticker (e.g. PLTR)"
                            class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:border-purple-400 text-sm uppercase outline-none transition"
                            onkeypress="if(event.key==='Enter') addCustomStock()"
                            style="text-transform:uppercase"
                        >
                        <button
                            onclick="addCustomStock()"
                            class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition-all">
                            <i class="fas fa-plus mr-1"></i>Add
                        </button>
                    </div>
                </div>

                <!-- Hot Topics (2/5) -->
                <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <h3 class="font-bold text-gray-900 flex items-center gap-2 mb-4">
                        <i class="fas fa-hashtag text-purple-500"></i>
                        Hot Topics
                    </h3>
                    <div id="topicBubbles" class="flex flex-wrap gap-2">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="border-b border-gray-100 px-2">
                    <nav class="flex gap-1">
                        <button onclick="switchTab('stocks')" id="stocksTab" class="tab-btn active">
                            <i class="fas fa-wallet text-purple-500"></i>My Portfolio
                        </button>
                        <button onclick="switchTab('topics')" id="topicsTab" class="tab-btn">
                            <i class="fas fa-tags text-purple-400"></i>My Topics
                        </button>
                        <button onclick="switchTab('digest')" id="digestTab" class="tab-btn">
                            <i class="fas fa-newspaper text-purple-400"></i>
                            News Digest
                            <span id="digestBadge" class="hidden bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">NEW</span>
                        </button>
                    </nav>
                </div>

                <div class="p-6">
                    <!-- Portfolio Tab -->
                    <div id="stocksContent" class="tab-content">
                        <div id="stocksList" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
                            <!-- Stocks loaded here -->
                        </div>
                    </div>

                    <!-- Topics Tab -->
                    <div id="topicsContent" class="tab-content hidden">
                        <div id="selectedTopicsList" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            <!-- Topics loaded here -->
                        </div>
                    </div>

                    <!-- Digest Tab -->
                    <div id="digestContent" class="tab-content hidden">
                        <div id="digestSummaries">
                            <!-- Summaries loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 shadow-2xl text-center max-w-sm w-full mx-4">
            <div class="w-16 h-16 bg-purple-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-spinner fa-spin text-3xl text-purple-600"></i>
            </div>
            <p class="text-lg font-bold text-gray-900 mb-1">Fetching Latest News</p>
            <p class="text-gray-500 text-sm">Processing articles with AI — this takes about 30–60 seconds</p>
            <div class="mt-4 bg-gray-100 rounded-full h-1.5 overflow-hidden">
                <div class="bg-purple-500 h-full rounded-full animate-pulse" style="width:60%"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/api';
        let currentUserId = null;

        // ── Stock catalogue ──────────────────────────────────────────────────────
        const STOCKS = [
            // Big Tech
            { t:'AAPL',  n:'Apple Inc.',         cat:'bigtech', icon:'fab fa-apple',     color:'from-gray-700 to-gray-900' },
            { t:'MSFT',  n:'Microsoft Corp.',     cat:'bigtech', icon:'fab fa-microsoft', color:'from-blue-500 to-blue-700' },
            { t:'GOOGL', n:'Alphabet Inc.',       cat:'bigtech', icon:'fab fa-google',    color:'from-red-500 to-yellow-500' },
            { t:'META',  n:'Meta Platforms',      cat:'bigtech', icon:'fab fa-meta',      color:'from-blue-600 to-indigo-700' },
            { t:'AMZN',  n:'Amazon.com Inc.',     cat:'bigtech', icon:'fab fa-amazon',    color:'from-orange-400 to-orange-600' },
            { t:'NFLX',  n:'Netflix Inc.',        cat:'bigtech', icon:'fas fa-film',      color:'from-red-600 to-red-800' },
            // AI & Chips
            { t:'NVDA',  n:'NVIDIA Corp.',        cat:'ai',      icon:'fas fa-microchip', color:'from-green-500 to-emerald-700' },
            { t:'AMD',   n:'Advanced Micro',      cat:'ai',      icon:'fas fa-cpu',       color:'from-red-500 to-red-700' },
            { t:'INTC',  n:'Intel Corp.',         cat:'ai',      icon:'fas fa-memory',    color:'from-blue-400 to-blue-600' },
            { t:'QCOM',  n:'Qualcomm Inc.',       cat:'ai',      icon:'fas fa-broadcast-tower', color:'from-indigo-500 to-indigo-700' },
            { t:'TSM',   n:'Taiwan Semi.',        cat:'ai',      icon:'fas fa-layer-group', color:'from-teal-500 to-teal-700' },
            { t:'PLTR',  n:'Palantir Tech.',      cat:'ai',      icon:'fas fa-eye',       color:'from-slate-600 to-slate-800' },
            // EV & Energy
            { t:'TSLA',  n:'Tesla Inc.',          cat:'ev',      icon:'fas fa-bolt',      color:'from-red-500 to-rose-700' },
            { t:'RIVN',  n:'Rivian Auto.',        cat:'ev',      icon:'fas fa-truck',     color:'from-green-600 to-green-800' },
            { t:'NIO',   n:'NIO Inc.',            cat:'ev',      icon:'fas fa-car',       color:'from-sky-500 to-sky-700' },
            { t:'LCID',  n:'Lucid Group',         cat:'ev',      icon:'fas fa-charging-station', color:'from-violet-500 to-violet-700' },
            // Finance
            { t:'JPM',   n:'JPMorgan Chase',      cat:'finance', icon:'fas fa-university', color:'from-blue-700 to-blue-900' },
            { t:'BAC',   n:'Bank of America',     cat:'finance', icon:'fas fa-landmark',  color:'from-red-700 to-red-900' },
            { t:'GS',    n:'Goldman Sachs',       cat:'finance', icon:'fas fa-chart-bar', color:'from-gray-600 to-gray-800' },
            { t:'V',     n:'Visa Inc.',           cat:'finance', icon:'fab fa-cc-visa',   color:'from-blue-600 to-blue-800' },
            { t:'MA',    n:'Mastercard Inc.',     cat:'finance', icon:'fab fa-cc-mastercard', color:'from-orange-500 to-red-600' },
            // Fintech
            { t:'PYPL',  n:'PayPal Holdings',     cat:'fintech', icon:'fab fa-paypal',    color:'from-blue-500 to-blue-700' },
            { t:'SQ',    n:'Block Inc.',          cat:'fintech', icon:'fas fa-square',    color:'from-gray-700 to-gray-900' },
            { t:'COIN',  n:'Coinbase Global',     cat:'fintech', icon:'fab fa-bitcoin',   color:'from-blue-400 to-blue-600' },
            { t:'SOFI',  n:'SoFi Technologies',   cat:'fintech', icon:'fas fa-piggy-bank', color:'from-violet-600 to-violet-800' },
            { t:'HOOD',  n:'Robinhood Mkts.',     cat:'fintech', icon:'fas fa-feather-alt', color:'from-green-500 to-green-700' },
            // Other
            { t:'DIS',   n:'Walt Disney Co.',     cat:'other',   icon:'fas fa-magic',     color:'from-blue-500 to-indigo-700' },
            { t:'SPOT',  n:'Spotify Tech.',       cat:'other',   icon:'fab fa-spotify',   color:'from-green-500 to-green-700' },
            { t:'ROKU',  n:'Roku Inc.',           cat:'other',   icon:'fas fa-tv',        color:'from-violet-500 to-purple-700' },
            { t:'UBER',  n:'Uber Tech.',          cat:'other',   icon:'fas fa-taxi',      color:'from-gray-700 to-gray-900' },
            { t:'RBLX',  n:'Roblox Corp.',        cat:'other',   icon:'fas fa-gamepad',   color:'from-red-500 to-red-700' },
            { t:'CRM',   n:'Salesforce Inc.',     cat:'other',   icon:'fas fa-cloud',     color:'from-sky-500 to-sky-700' },
        ];

        let activeCategory = 'all';

        function filterCategory(cat, el) {
            activeCategory = cat;
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderStockPills();
        }

        function renderStockPills() {
            const filtered = activeCategory === 'all' ? STOCKS : STOCKS.filter(s => s.cat === activeCategory);
            document.getElementById('stockPills').innerHTML = filtered.map(s => `
                <span
                    onclick="quickAddStock('${s.t}', '${s.n}')"
                    title="${s.n}"
                    class="ticker-pill bg-gradient-to-r ${s.color} text-white">
                    <i class="${s.icon} text-xs opacity-80"></i>${s.t}
                </span>
            `).join('');
        }

        // ── Auth ─────────────────────────────────────────────────────────────────
        async function signIn() {
            const email = document.getElementById('userEmail').value.trim();
            if (!email) { alert('Please enter your email'); return; }

            try {
                const loadRes = await fetch(`${API_URL}/users/by-email/${encodeURIComponent(email)}`);
                if (loadRes.ok) {
                    const user = await loadRes.json();
                    currentUserId = user.id;
                    onSignedIn(email);
                } else {
                    const createRes = await fetch(`${API_URL}/users`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    if (createRes.ok) {
                        const user = await createRes.json();
                        currentUserId = user.id;
                        onSignedIn(email);
                    } else {
                        alert('Error creating account. Please try again.');
                    }
                }
            } catch (e) {
                console.error(e);
                alert('Cannot connect to server. Make sure the backend is running.');
            }
        }

        function onSignedIn(email) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('refreshButton').classList.remove('hidden');
            document.getElementById('liveIndicator').classList.remove('hidden');
            document.getElementById('liveIndicator').classList.add('flex');
            document.getElementById('liveUserLabel').textContent = email.split('@')[0];
            loadUserData();
        }

        function signOut() {
            currentUserId = null;
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('refreshButton').classList.add('hidden');
            document.getElementById('liveIndicator').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('userEmail').value = '';
        }

        function loadUserData() {
            loadStocks();
            loadTopics();
            loadAvailableTopics();
            loadDigest();
        }

        // ── Digest trigger ───────────────────────────────────────────────────────
        async function refreshDigestNow() {
            if (!currentUserId) return;
            document.getElementById('loadingOverlay').classList.remove('hidden');

            try {
                const res = await fetch(`${API_URL}/trigger-digest-fast`, { method: 'POST' });
                const result = await res.json();

                if (res.ok) {
                    const timing = result.timing ? ` (${result.timing.total_seconds}s)` : '';
                    const emailStatus = result.email_error
                        ? `\n⚠️ Email error: ${result.email_error}`
                        : result.emails_sent > 0
                            ? `\n📧 Emails sent: ${result.emails_sent}`
                            : '\n📧 No emails sent (no users or email not configured)';

                    setTimeout(() => {
                        loadDigest();
                        document.getElementById('loadingOverlay').classList.add('hidden');
                        document.getElementById('digestBadge').classList.remove('hidden');
                        switchTab('digest');
                        alert(`✅ Done${timing}\n\n📰 Articles: ${result.articles_fetched}\n🤖 Summaries: ${result.summaries_processed}\n💰 Cost: ${result.estimated_cost}${emailStatus}`);
                    }, 1500);
                } else {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    alert(`Error: ${result.detail || 'Unknown error. Check Render logs.'}`);
                }
            } catch (e) {
                console.error(e);
                document.getElementById('loadingOverlay').classList.add('hidden');
                alert('Connection error. Please try again.');
            }
        }

        // ── Tab switching ────────────────────────────────────────────────────────
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`${tab}Content`).classList.remove('hidden');
            document.getElementById(`${tab}Tab`).classList.add('active');
            if (tab === 'digest') {
                document.getElementById('digestBadge').classList.add('hidden');
                loadDigest();
            }
        }

        // ── Stocks ───────────────────────────────────────────────────────────────
        async function quickAddStock(ticker, company) {
            if (!currentUserId) { alert('Please sign in first'); return; }
            try {
                const res = await fetch(`${API_URL}/users/${currentUserId}/stocks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker, company_name: company })
                });
                if (res.ok || (await res.json()).detail === 'Stock already in portfolio') {
                    loadStocks();
                }
            } catch (e) { console.error(e); }
        }

        async function addCustomStock() {
            const raw = document.getElementById('customTicker').value.trim().toUpperCase();
            if (!raw) return;
            const known = STOCKS.find(s => s.t === raw);
            await quickAddStock(raw, known ? known.n : null);
            document.getElementById('customTicker').value = '';
        }

        async function loadStocks() {
            if (!currentUserId) return;
            try {
                const res = await fetch(`${API_URL}/users/${currentUserId}/stocks`);
                const stocks = await res.json();
                const container = document.getElementById('stocksList');

                if (stocks.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-16">
                            <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fas fa-chart-line text-3xl text-gray-300"></i>
                            </div>
                            <p class="text-gray-400 font-medium">No stocks yet</p>
                            <p class="text-gray-400 text-sm mt-1">Click a stock badge above to add it</p>
                        </div>`;
                    return;
                }

                container.innerHTML = stocks.map(stock => {
                    const meta = STOCKS.find(s => s.t === stock.ticker);
                    const gradient = meta ? meta.color : 'from-purple-500 to-purple-700';
                    const icon = meta ? meta.icon : 'fas fa-chart-line';
                    return `
                    <div class="card-hover bg-white border border-gray-100 rounded-xl p-4 flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${gradient} flex items-center justify-center flex-shrink-0">
                                <i class="${icon} text-white text-sm"></i>
                            </div>
                            <div>
                                <div class="font-bold text-gray-900">${stock.ticker}</div>
                                ${stock.company_name ? `<div class="text-xs text-gray-500 mt-0.5">${stock.company_name}</div>` : ''}
                            </div>
                        </div>
                        <button onclick="deleteStock(${stock.id})" class="text-gray-300 hover:text-red-500 transition p-1.5 rounded-lg hover:bg-red-50">
                            <i class="fas fa-times text-sm"></i>
                        </button>
                    </div>`;
                }).join('');
            } catch (e) { console.error(e); }
        }

        async function deleteStock(id) {
            if (!confirm('Remove this stock?')) return;
            await fetch(`${API_URL}/users/${currentUserId}/stocks/${id}`, { method: 'DELETE' });
            loadStocks();
        }

        // ── Topics ───────────────────────────────────────────────────────────────
        const TOPIC_COLORS = [
            'from-purple-500 to-purple-700',
            'from-blue-500 to-blue-700',
            'from-emerald-500 to-emerald-700',
            'from-amber-500 to-orange-600',
            'from-rose-500 to-rose-700',
            'from-pink-500 to-pink-700',
            'from-indigo-500 to-indigo-700',
            'from-teal-500 to-teal-700',
        ];

        async function loadAvailableTopics() {
            try {
                const res = await fetch(`${API_URL}/topics/available`);
                const data = await res.json();
                document.getElementById('topicBubbles').innerHTML = data.topics.slice(0, 16).map((topic, i) => `
                    <span onclick="addTopic('${topic}')" class="ticker-pill bg-gradient-to-r ${TOPIC_COLORS[i % TOPIC_COLORS.length]} text-white text-xs">
                        ${topic}
                    </span>`).join('');
            } catch (e) { console.error(e); }
        }

        async function loadTopics() {
            if (!currentUserId) return;
            try {
                const res = await fetch(`${API_URL}/users/${currentUserId}/topics`);
                const topics = await res.json();
                const container = document.getElementById('selectedTopicsList');

                if (topics.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-16">
                            <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fas fa-tags text-3xl text-gray-300"></i>
                            </div>
                            <p class="text-gray-400 font-medium">No topics selected</p>
                            <p class="text-gray-400 text-sm mt-1">Click a topic above to track it</p>
                        </div>`;
                    return;
                }

                container.innerHTML = topics.map(topic => `
                    <div class="bg-purple-50 border border-purple-100 px-4 py-3 rounded-xl flex items-center justify-between">
                        <span class="text-purple-900 font-semibold text-sm">${topic.topic_name}</span>
                        <button onclick="deleteTopic(${topic.id})" class="text-gray-300 hover:text-red-500 transition ml-2">
                            <i class="fas fa-times text-xs"></i>
                        </button>
                    </div>`).join('');
            } catch (e) { console.error(e); }
        }

        async function addTopic(name) {
            if (!currentUserId) { alert('Please sign in first'); return; }
            await fetch(`${API_URL}/users/${currentUserId}/topics`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic_name: name })
            });
            loadTopics();
        }

        async function deleteTopic(id) {
            await fetch(`${API_URL}/users/${currentUserId}/topics/${id}`, { method: 'DELETE' });
            loadTopics();
        }

        // ── Digest display ───────────────────────────────────────────────────────
        function timeAgo(dateStr) {
            const diff = (Date.now() - new Date(dateStr)) / 1000;
            if (diff < 3600) return `${Math.round(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.round(diff / 3600)}h ago`;
            return `${Math.round(diff / 86400)}d ago`;
        }

        function sentimentBadge(s) {
            const map = {
                bullish: ['sentiment-bullish', '📈 BULLISH'],
                bearish: ['sentiment-bearish', '📉 BEARISH'],
                neutral: ['sentiment-neutral', '➡️ NEUTRAL'],
            };
            const [cls, label] = map[s?.toLowerCase()] || map.neutral;
            return `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold ${cls}">${label}</span>`;
        }

        function impactBadge(i) {
            const map = {
                high:   ['impact-high',   'HIGH IMPACT'],
                medium: ['impact-medium', 'MED IMPACT'],
                low:    ['impact-low',    'LOW IMPACT'],
            };
            const [cls, label] = map[i?.toLowerCase()] || map.low;
            return `<span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold ${cls}">${label}</span>`;
        }

        async function loadDigest() {
            if (!currentUserId) return;
            const container = document.getElementById('digestSummaries');

            // Skeleton loader
            container.innerHTML = `
                <div class="space-y-4">
                    ${[1,2,3].map(() => `
                    <div class="bg-white rounded-2xl p-6 border border-gray-100">
                        <div class="skeleton h-6 w-24 mb-4"></div>
                        <div class="skeleton h-4 w-full mb-2"></div>
                        <div class="skeleton h-4 w-3/4 mb-4"></div>
                        <div class="flex gap-2">
                            <div class="skeleton h-7 w-24 rounded-full"></div>
                            <div class="skeleton h-7 w-28 rounded-full"></div>
                        </div>
                    </div>`).join('')}
                </div>`;

            try {
                const res = await fetch(`${API_URL}/users/${currentUserId}/summaries?limit=20`);
                if (!res.ok) {
                    container.innerHTML = `
                        <div class="text-center py-16">
                            <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fas fa-exclamation-triangle text-2xl text-red-400"></i>
                            </div>
                            <p class="text-gray-700 font-semibold">Failed to load digest</p>
                            <p class="text-gray-400 text-sm mt-1">Server returned ${res.status}. Check Render logs.</p>
                        </div>`;
                    return;
                }

                const summaries = await res.json();

                if (!Array.isArray(summaries) || summaries.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-20">
                            <div class="w-20 h-20 bg-purple-50 rounded-2xl flex items-center justify-center mx-auto mb-5">
                                <i class="fas fa-newspaper text-4xl text-purple-200"></i>
                            </div>
                            <p class="text-gray-700 font-bold text-lg mb-2">No summaries yet</p>
                            <p class="text-gray-400 text-sm mb-6">Add stocks to your portfolio, then click "Get Latest News"</p>
                            <button onclick="refreshDigestNow()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-semibold text-sm shadow-sm transition-all">
                                <i class="fas fa-bolt mr-2 text-yellow-300"></i>Get Latest News
                            </button>
                        </div>`;
                    return;
                }

                // Group by ticker
                const byTicker = {};
                summaries.forEach(s => {
                    if (!byTicker[s.stock_ticker]) byTicker[s.stock_ticker] = [];
                    byTicker[s.stock_ticker].push(s);
                });

                container.innerHTML = Object.entries(byTicker).map(([ticker, items]) => {
                    const meta = STOCKS.find(s => s.t === ticker);
                    const gradient = meta ? meta.color : 'from-purple-500 to-purple-700';
                    const icon = meta ? meta.icon : 'fas fa-chart-line';

                    return `
                    <div class="digest-card bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-5">
                        <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${gradient} flex items-center justify-center flex-shrink-0">
                                <i class="${icon} text-white"></i>
                            </div>
                            <div>
                                <h3 class="text-2xl font-extrabold text-gray-900">${ticker}</h3>
                                ${meta ? `<p class="text-gray-400 text-xs font-medium">${meta.n}</p>` : ''}
                            </div>
                            <span class="ml-auto bg-purple-50 text-purple-600 text-xs font-bold px-3 py-1.5 rounded-full border border-purple-100">
                                ${items.length} ${items.length === 1 ? 'article' : 'articles'}
                            </span>
                        </div>

                        ${items.map(s => `
                        <div class="summary-item">
                            <div class="flex items-start justify-between gap-4 mb-3">
                                <h4 class="font-semibold text-gray-800 text-sm leading-snug flex-1">${s.article_title}</h4>
                                <span class="text-gray-400 text-xs whitespace-nowrap flex-shrink-0 mt-0.5">${timeAgo(s.created_at)}</span>
                            </div>

                            <div class="flex flex-wrap gap-2 mb-3">
                                ${sentimentBadge(s.sentiment)}
                                ${impactBadge(s.impact_level)}
                                <span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600">
                                    <i class="fas fa-star text-amber-400"></i>${s.confidence_score}/10
                                </span>
                            </div>

                            <p class="text-gray-600 text-sm leading-relaxed mb-3 whitespace-pre-line">${s.summary}</p>

                            <div class="bg-gradient-to-r from-purple-50 to-indigo-50 border-l-4 border-purple-400 px-4 py-3 rounded-r-xl mb-3">
                                <p class="text-xs font-bold text-purple-700 mb-0.5">💡 Why it matters</p>
                                <p class="text-gray-700 text-sm">${s.impact_explanation}</p>
                            </div>

                            <a href="${s.article_url}" target="_blank" rel="noopener"
                               class="inline-flex items-center gap-1.5 text-purple-600 hover:text-purple-800 text-xs font-semibold transition">
                                <i class="fas fa-external-link-alt"></i>Read Full Article
                            </a>
                        </div>`).join('')}
                    </div>`;
                }).join('');
            } catch (e) {
                console.error(e);
                container.innerHTML = `
                    <div class="text-center py-16">
                        <div class="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-wifi text-2xl text-red-300"></i>
                        </div>
                        <p class="text-gray-700 font-semibold">Connection error</p>
                        <p class="text-gray-400 text-sm mt-1">Could not reach the server. Please refresh.</p>
                    </div>`;
            }
        }

        // ── Init ─────────────────────────────────────────────────────────────────
        renderStockPills();
    </script>
</body>
</html>
